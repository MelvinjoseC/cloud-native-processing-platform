apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: processing-platform
  labels:
    role: alert-rules
spec:
  groups:
    - name: platform.rules
      rules:
        - alert: QueueBacklogHigh
          expr: rabbitmq_queue_messages{queue="tasks"} > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ task queue backlog is high"
            description: "The queue 'tasks' has more than 100 messages for over 2 minutes. Workers might be scaling too slowly or failing."

        - alert: WorkerScaleLimitReached
          expr: kube_deployment_status_replicas{deployment="worker"} == 10
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Worker nodes running at maximum capacity"
            description: "The background worker deployment has reached its max replica count of 10. Queue processing speed may degrade."

        - alert: RedisCacheOffline
          expr: http_requests_total{endpoint="/api/v1/jobs", status="503"} > 5
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "FastAPI producer experiencing high 503 error rate"
            description: "The Producer service is returning 503 codes, likely due to broker or database disconnection."

        - alert: WorkerCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{container="worker"}[5m]) * 60 > 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Worker container is restarting frequently"
            description: "The worker pod container is restarting more than 2 times in 5 minutes, indicating potential crash looping."

        - alert: HighRequestLatency
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 2
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "FastAPI endpoint experiencing high latency"
            description: "The 95th percentile request duration for endpoint {{ $labels.endpoint }} is above 2 seconds for over 3 minutes."

        - alert: DeadLetterQueueHasMessages
          expr: rabbitmq_queue_messages{queue="tasks_dlq"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ Dead Letter Queue contains failed messages"
            description: "The DLQ 'tasks_dlq' has {{ $value }} unprocessed poisoned messages. Investigate worker errors."

        - alert: WorkerHighTaskFailureRate
          expr: sum(rate(worker_jobs_processed_total{status="failed"}[5m])) / sum(rate(worker_jobs_processed_total[5m])) > 0.1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High worker job failure rate detected"
            description: "Over 10% of worker tasks are failing and being routed to DLQ in the last 5 minutes."
