apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical-priority
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Mission-critical core platform services (RabbitMQ, Redis, API producer)"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-worker-priority
value: 500000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Priority class for scale-to-zero asynchronous worker pods"
