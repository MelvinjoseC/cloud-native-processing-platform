# Default values for cost-optimizer-app

global:
  namespace: processing-platform

secrets:
  rabbitmqUser: guest
  rabbitmqPass: guest
  redisPassword: strongpassword

producer:
  replicaCount: 2
  image:
    repository: ghcr.io/melvinjosec/cloud-native-processing-platform-producer
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  service:
    port: 80
    targetPort: 8000
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  image:
    repository: ghcr.io/melvinjosec/cloud-native-processing-platform-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  # KEDA autoscaling properties
  keda:
    enabled: true
    minReplicas: 0
    maxReplicas: 10
    cooldownPeriod: 30
    queueLengthTriggerValue: 5
  terminationGracePeriodSeconds: 120
  nodeSelector:
    lifecycle: spot
  tolerations: []
  affinity: {}

rabbitmq:
  image: rabbitmq:3.12-management
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  image: redis:7.2-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

resilience:
  pdb:
    enabled: true
  networkPolicy:
    enabled: true

ingress:
  enabled: false
  className: nginx
  host: processing.platform.internal
  tls:
    enabled: true
    secretName: platform-tls-cert
